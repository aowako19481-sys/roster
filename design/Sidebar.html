</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{addons}}" as="t" hint-placeholder-count="3">
<a href="{{t.href}}" class="navl" aria-current="{{t.current}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; height: 68px; border-radius: 14px; background: {{t.bg}}; color: {{t.fg}}; border: 1px dashed {{t.bd}}; text-decoration: none; font-size: 11px; font-weight: 500"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="{{t.icon}}"></path></svg>{{t.label}}</a>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="padding: 0 8px 6px; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: #4F4A43">Quick actions</span>
<sc-for list="{{quick}}" as="q" hint-placeholder-count="5">
<a href="{{q.href}}" class="navl" style="display: flex; justify-content: space-between; align-items: center; padding: 9px 8px; border-radius: 10px; font-size: 13px; color: #1B1A17; text-decoration: none"><span>{{q.label}}</span><span style="font-family: 'Geist Mono', monospace; font-size: 11px; color: #4F4A43">{{q.meta}}</span></a>

</div>
<a href="SignIn.dc.html" class="navl" style="margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 12px; color: #1B1A17; text-decoration: none"><span style="width: 34px; height: 34px; border-radius: 999px; background: rgba(255,255,255,0.45); display: grid; place-items: center; font-size: 12px; font-weight: 600">AO</span><span style="display: flex; flex-direction: column; font-size: 13px"><span style="font-weight: 500">Adaya Owako</span><span style="font-size: 12px; color: #4F4A43">Sign out</span></span></a>
</nav>
